# 302 Redirect rules for /cars -> https://buywheels.netlify.app/cars
[[redirects]]
  from = "/cars/*"
  to = "https://buywheels.netlify.app/cars/:splat"
  status = 302

[[redirects]]
  from = "/cars"
  to = "https://buywheels.netlify.app/cars"
  status = 302

[[redirects]]
  from = "/vehicle/*"
  to = "https://buywheels.netlify.app/vehicle/:splat"
  status = 302

[[redirects]]
  from = "/ev"
  to = "https://buywheels.netlify.app/ev"
  status = 302

# SPA single-page application fallback for buywheels 2 main site
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
