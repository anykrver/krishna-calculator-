# Proxy rules for buywheels.in/cars -> https://buywheels.netlify.app/
[[redirects]]
  from = "/cars/*"
  to = "https://buywheels.netlify.app/cars/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/cars"
  to = "https://buywheels.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/vehicle/*"
  to = "https://buywheels.netlify.app/vehicle/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ev"
  to = "https://buywheels.netlify.app/ev"
  status = 200
  force = true

# SPA single-page application fallback for buywheels 2 main site
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
